min_version = "2026.8.0"

[settings]
pin = true
lockfile = true
idiomatic_version_file_enable_tools = []

  [settings.status]
  missing_tools = "always"

[tools]
oh-my-posh = "33.0.0"

# Kubernetes
kubectl = "latest"
talosctl = "latest"
flux2 = "latest"
helm = "latest"
k9s = "latest"
cilium-cli = "latest"
cilium-hubble = "latest"
cmctl = "latest"
loki-logcli = "latest"

# Cloud
oxker = "latest"

# Helix
yamlfmt = "latest"
yq = "latest"
jq = "latest"
prettier = "latest"
taplo = "latest"
rumdl = "latest"
typst = "latest"
tinymist = "latest"
"aqua:google/yamlfmt" = "latest"

# Dev
just = "latest"
bun = "latest"
"aqua:astral-sh/uv" = "latest"
"aqua:astral-sh/ruff" = "latest"
