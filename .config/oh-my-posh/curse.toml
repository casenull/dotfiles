"$schema" = "https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json"
version = 4
final_space = true

[[blocks]]
type = "prompt"
alignment = "left"

  [[blocks.segments]]
  type = "text"
  style = "plain"
  foreground = "green"
  background = "transparent"
  template = "{{ if .Env.VIRTUAL_ENV }}<b>({{ base .Env.VIRTUAL_ENV }})</b> {{ end }}"

  [[blocks.segments]]
  type = "path"
  style = "plain"
  foreground = "cyan"
  background = "transparent"
  template = "{{ .Path }}"
  properties.style = "folder"

  # Mimics __git_ps1 from git-sh-prompt with GIT_PS1_SHOWDIRTYSTATE=1 and GIT_PS1_SHOWCOLORHINTS=1
  [[blocks.segments]]
  type = "git"
  style = "plain"
  foreground = "default"
  background = "transparent"
  template = """
    {{- $gitdir := print .Dir "/.git" -}}
    {{- if or (eq .PWD $gitdir) (hasPrefix (print $gitdir "/") .PWD) }} <green>GIT_DIR!</>
    {{- else }} {{ if .Rebase }}<green>{{ if trim .Rebase.HEAD }}{{ .Rebase.HEAD }}{{ else }}{{ .Ref }}{{ end }}</>
      {{- else if .Detached }}<red>({{ .Ref }}{{ if eq .Ref .ShortHash }}...{{ end }})</>
      {{- else }}<green>{{ .Ref }}</>{{ end }}
      {{- $w := gt (add .Working.Modified .Working.Deleted .Working.Moved .Working.Unmerged) 0 }}
      {{- $i := gt (add .Staging.Added .Staging.Modified .Staging.Deleted .Staging.Moved .Staging.Unmerged) 0 }}
      {{- $n := and (eq .Hash "(initial)") (not $i) }}
      {{- if or $w $i $n }} {{ end }}
      {{- if $w }}<red>*</>{{ end }}
      {{- if $i }}<green>+</>{{ end }}
      {{- if $n }}<green>#</>{{ end }}
      {{- if .Rebase }}{{ if trim .Rebase.HEAD }}|REBASE{{ else }}|AM{{ end }} {{ .Rebase.Current }}/{{ .Rebase.Total }}
      {{- else if .CherryPick }}|CHERRY-PICKING
      {{- else if .Revert }}|REVERTING
      {{- else if .Merge }}|MERGING
      {{- else if glob (print $gitdir "/BISECT_LOG") }}|BISECTING{{ end }}
    {{- end }}"""
  options = { fetch_status = true, branch_icon = "", commit_icon = "", tag_icon = "", rebase_icon = "", cherry_pick_icon = "", revert_icon = "", merge_icon = "", no_commits_icon = "" }

  [[blocks.segments]]
  type = "text"
  style = "plain"
  foreground_templates = [
    "{{ if gt .Code 0 }}red{{ end }}",
    "{{ if eq .Code 0 }}green{{ end }}",
  ]
  background = "transparent"
  template = " >"

[secondary_prompt]
foreground = "darkGray"
background = "transparent"
template = "> "

[[blocks]]
type = "rprompt"
overflow = "hidden"

  [[blocks.segments]]
  type = "executiontime"
  style = "plain"
  foreground = "yellow"
  background = "transparent"
  template = "{{ .FormattedMs }}"
  properties = { threshold = 5000 }

[[tooltips]]
type = "kubectl"
tips = ["kubectl", "helm", "flux", "flux-operator", "cilium", "hubble"]
style = "plain"
foreground = "white"
background = "#1545A8"
template = " {{ .Context }}{{ if .Namespace }}:{{ .Namespace }}{{ end }} "

[[tooltips]]
type = "talosctl"
tips = ["talosctl", "topf"]
style = "plain"
foreground = "white"
background = "#E12D46"
template = " {{ .Context }} "
