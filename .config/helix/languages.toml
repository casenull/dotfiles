# Programming

[language-server.golangci-lint-lsp.config]
command = [
  "golangci-lint",
  "run",
  "--output.json.path=stdout",
  "--show-stats=false",
  "--issues-exit-code=1",
]

[[language]]
name = "go"
language-servers = ["gopls", "golangci-lint-lsp"]
formatter = { command = "goimports" }
auto-format = true

[[language]]
name = "bash"
formatter = { command = "shfmt" }
auto-format = true

[[language]]
name = "python"
auto-format = true

# Documentation

[language-server.rumdl]
command = "rumdl"
args = ["server"]

[language-server.ltex-ls-plus.config.ltex]
language = "en-GB"
additionalRules.enablePickyRules = true
latex.commands = { "\\gls{}" = "default" }
# languageToolHttpServerUri = "http://localhost:8010"

  [language-server.ltex-ls-plus.config.ltex.disabledRules]
  en-GB = [
    "PROFANITY",
    "DASH_RULE",
    "TWO_HYPHENS",
    "PLUS_MINUS",
    "ELLIPSIS",
    "EN_QUOTES",
    "HYPHEN_TO",
    "PUNCTUATION_PARAGRAPH_END",
  ]
  de-CH = [
    "TYPOGRAFISCHE_ANFUEHRUNGSZEICHEN_CH",
    "TYPOGRAFISCHE_ANFUEHRUNGSZEICHEN_2",
    "TYPOGRAFISCHE_APOSTROPHE",
    "MULTIPLICATION_SIGN",
    "ABKUERZUNG_LEERZEICHEN",
    "AUSLASSUNGSPUNKTE",
  ]

[language-server.tinymist.config]
formatterMode = "typstyle"
exportPdf = "onSave"

[[language]]
name = "markdown"
language-servers = ["rumdl", "ltex-ls-plus", "mpls"]
auto-format = true

[language-server.mpls]
command = "mpls"
args = ["--theme", "dark", "--no-auto"]

[[language]]
name = "typst"
language-servers = ["tinymist", "ltex-ls-plus"]
auto-format = true

[[language]]
name = "latex"
language-servers = ["texlab", "ltex-ls-plus"]
indent = { tab-width = 2, unit = "\t" }
formatter = { command = "latexindent", args = ["--cruft=/tmp/"] }
auto-format = true

# Configuration

[[language]]
name = "yaml"
formatter = { command = "yamlfmt", args = [
  "-formatter",
  "retain_line_breaks=true,scan_folded_as_literal=true,trim_trailing_whitespace=true",
  "-",
] }
auto-format = true

[[language]]
name = "docker-compose"
formatter = { command = "yamlfmt", args = [
  "-formatter",
  "retain_line_breaks=true,scan_folded_as_literal=true,trim_trailing_whitespace=true",
  "-",
] }
auto-format = true

[[language]]
name = "toml"
formatter = { command = "taplo", args = [
  "format",
  "--option",
  "indent_tables=true",
  "-",
] }
auto-format = true

[[language]]
name = "json"
formatter = { command = "prettier", args = ["--parser", "json", "--use-tabs"] }
auto-format = true

[[language]]
name = "json5"
formatter = { command = "prettier", args = ["--parser", "json5"] }
auto-format = true

[[language]]
name = "nix"
formatter = { command = "nixfmt" }

[[language]]
name = "hcl"
injection-regex = "(hcl|tf|nomad|tofu)"
file-types = ["hcl", "tf", "nomad", "tofu"]
formatter = { command = "tofu", args = ["fmt", "-"] }
auto-format = true

[[language]]
name = "tfvars"
formatter = { command = "tofu", args = ["fmt", "-"] }
auto-format = true

[[language]]
name = "alloy"
formatter = { command = "alloy", args = ["fmt", "-"] }
auto-format = true

# EXPERIMENTAL

[language-server.jdtls.config.java]
format = { enabled = true }

[[language]]
name = "java"
auto-format = true

[[language]]
name = "haskell"
auto-format = true

[[language]]
name = "c"
auto-format = true

[[language]]
name = "cpp"
auto-format = true
