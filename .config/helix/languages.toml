[language-server.lua-language-server.config.Lua.format]
enable = true

[[language]]
name = "lua"
auto-format = true

[language-server.harper-ls]
command = "harper-ls"
args = ["--stdio"]

  [language-server.harper-ls.config.harper-ls]
  dialect = "British"

[[language]]
name = "just"
scope = "source.just"
file-types = [
  "just",
  { glob = "justfile" },
  { glob = "Justfile" },
  { glob = ".justfile" },
  { glob = ".Justfile" },
]
injection-regex = "just"
comment-token = "#"
indent = { tab-width = 4, unit = "    " }
language-servers = ["just-lsp"]
formatter = { command = "just", args = ["--fmt", "--justfile", "-"] }
auto-format = true


[language-server.jinja-lsp]
command = "jinja-lsp"
timeout = 5

[[language]]
name = "jinja"
language-servers = ["jinja-lsp"]
